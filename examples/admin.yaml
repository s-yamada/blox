# admin.yaml - 管理画面 サンプル
# ダッシュボード・一覧・編集フォームを想定

title: "管理画面"
theme: gray

pages:

  # ================================================================
  # No.1 ダッシュボード
  # ================================================================
  - title: "ダッシュボード"
    name: "dashboard"
    nav: true
    nav_label: "ダッシュボード"
    blocks:
      - type: stats
        h_mm: 22
        items:
          - num: "1,284"
            label: "本日の注文数"
          - num: "¥3,842,000"
            label: "本日の売上"
          - num: "94.2%"
            label: "注文完了率"
          - num: "12件"
            label: "未対応問い合わせ"

      - type: col
        cols: 12
        h_mm: 55
        cells:
          - kind: text
            span: 8
            title: "売上推移（直近7日）"
            text: "（グラフエリア）"
          - kind: table
            span: 4
            headers: ["日付", "売上"]
            items:
              - ["5/23", "¥3,120,000"]
              - ["5/24", "¥2,980,000"]
              - ["5/25", "¥3,450,000"]
              - ["5/26", "¥3,210,000"]
              - ["5/27", "¥4,100,000"]
              - ["5/28", "¥3,780,000"]
              - ["5/29", "¥3,842,000"]

      - type: col
        cols: 12
        h_mm: 50
        cells:
          - kind: text
            span: 6
            title: "新着注文（直近5件）"
          - kind: text
            span: 6
            title: "未対応問い合わせ"

      - type: col
        cols: 12
        h_mm: 55
        cells:
          - kind: table
            span: 6
            headers: ["注文ID", "顧客名", "金額", "状態"]
            items:
              - ["#10584", "山田 太郎", "¥12,800", "決済完了"]
              - ["#10583", "鈴木 花子", "¥3,980", "配送中"]
              - ["#10582", "田中 一郎", "¥28,400", "処理中"]
              - ["#10581", "佐藤 美咲", "¥5,200", "決済完了"]
              - ["#10580", "高橋 健二", "¥9,800", "完了"]
          - kind: table
            span: 6
            headers: ["ID", "件名", "受付日"]
            items:
              - ["#524", "注文が届かない", "5/29"]
              - ["#523", "返品について", "5/28"]
              - ["#522", "領収書の発行", "5/28"]
              - ["#521", "商品の在庫確認", "5/27"]

  # ================================================================
  # No.2 注文一覧
  # ================================================================
  - title: "注文一覧"
    name: "orders"
    nav: true
    nav_label: "注文管理"
    blocks:
      - type: col
        cols: 12
        h_mm: 20
        cells:
          - kind: form
            span: 12
            items:
              - label: "ステータス"
                type: select
                options:
                  - "すべて"
                  - "決済完了"
                  - "配送中"
                  - "完了"
                  - "キャンセル"
              - label: "絞り込む"
                type: button
                color: secondary

      - type: col
        cols: 12
        h_mm: 80
        cells:
          - kind: table
            span: 12
            headers: ["注文ID", "注文日時", "顧客名", "商品数", "合計金額", "ステータス"]
            items:
              - ["#10584", "2024-05-29 14:32", "山田 太郎", "3点", "¥12,800", "決済完了"]
              - ["#10583", "2024-05-29 11:15", "鈴木 花子", "1点", "¥3,980", "配送中"]
              - ["#10582", "2024-05-29 09:48", "田中 一郎", "5点", "¥28,400", "処理中"]
              - ["#10581", "2024-05-28 18:22", "佐藤 美咲", "2点", "¥5,200", "決済完了"]
              - ["#10580", "2024-05-28 16:05", "高橋 健二", "4点", "¥9,800", "完了"]
              - ["#10579", "2024-05-28 13:40", "伊藤 裕子", "1点", "¥1,980", "完了"]
              - ["#10578", "2024-05-27 10:12", "渡辺 聡", "2点", "¥7,600", "キャンセル"]

  # ================================================================
  # No.3 注文詳細・編集
  # ================================================================
  - title: "注文詳細"
    name: "order-detail"
    blocks:
      - type: col
        cols: 12
        h_mm: 40
        cells:
          - kind: table
            span: 12
            headers: ["項目", "内容"]
            items:
              - ["注文ID", "#10584"]
              - ["注文日時", "2024-05-29 14:32:05"]
              - ["顧客名", "山田 太郎（yamada@example.com）"]
              - ["お届け先", "東京都千代田区〇〇1-2-3"]
              - ["お支払い方法", "クレジットカード（末尾1234）"]

      - type: col
        cols: 12
        h_mm: 35
        cells:
          - kind: table
            span: 12
            headers: ["商品名", "単価", "数量", "小計"]
            items:
              - ["プレミアムコーヒーセット", "¥3,980", "2", "¥7,960"]
              - ["ハーブティーバラエティ", "¥1,980", "1", "¥1,980"]
              - ["", "", "合計", "¥9,940"]

      - type: col
        cols: 12
        h_mm: 35
        cells:
          - kind: form
            span: 8
            items:
              - label: "ステータス"
                type: select
                options:
                  - "決済完了"
                  - "配送中"
                  - "完了"
                  - "キャンセル"
              - label: "配送伝票番号"
                type: text
                placeholder: "1234-5678-9012"
              - label: "メモ（社内用）"
                type: textarea
              - type: buttons
                items:
                  - label: "更新する"
                    color: primary
                  - label: "キャンセル"
                    color: secondary
