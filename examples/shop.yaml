# shop.yaml - ECサイト・ショッピングサイト サンプル
# 商品一覧・商品詳細・カート・注文フォームを想定

title: "サンプルショップ"
theme: warm

pages:

  # ================================================================
  # No.1 トップ・商品一覧
  # ================================================================
  - title: "商品一覧"
    name: "products"
    nav: true
    nav_label: "商品一覧"
    blocks:
      - type: hero
        h_mm: 40
        image_label: "バナー画像"
        caption: "今だけ！新商品20%OFF セール開催中"

      - type: stats
        h_mm: 18
        items:
          - num: "1,200点+"
            label: "商品数"
          - num: "当日発送"
            label: "平日15時までの注文"
          - num: "送料無料"
            label: "5,000円以上"
          - num: "30日間"
            label: "返品保証"

      - type: grid
        kind: card
        cols: 3
        item_h_mm: 65
        items:
          - image_label: "商品写真A"
            title: "プレミアムコーヒーセット"
            text: "¥3,980（税込）\n★★★★☆ (128件)"
          - image_label: "商品写真B"
            title: "オーガニック緑茶 詰め合わせ"
            text: "¥2,480（税込）\n★★★★★ (256件)"
          - image_label: "商品写真C"
            title: "ハーブティーバラエティ"
            text: "¥1,980（税込）\n★★★★☆ (89件)"
          - image_label: "商品写真D"
            title: "フルーツジュース 6本セット"
            text: "¥4,200（税込）\n★★★☆☆ (45件)"
          - image_label: "商品写真E"
            title: "スパークリングウォーター"
            text: "¥1,500（税込）\n★★★★☆ (312件)"
          - image_label: "商品写真F"
            title: "抹茶スイーツセット"
            text: "¥3,200（税込）\n★★★★★ (178件)"

  # ================================================================
  # No.2 商品詳細
  # ================================================================
  - title: "商品詳細"
    name: "product-detail"
    blocks:
      - type: col
        cols: 12
        h_mm: 80
        cells:
          - kind: img
            span: 6
            image_label: "商品メイン画像"
          - kind: text
            span: 6
            title: "プレミアムコーヒーセット（200g×3種）"
            text: "世界三大コーヒー産地から厳選した豆を詰め合わせました。\nエチオピア・コロンビア・ブラジルの飲み比べをお楽しみください。\n\n¥3,980（税込・送料別）"

      - type: col
        cols: 12
        h_mm: 45
        cells:
          - kind: table
            span: 12
            headers: ["項目", "詳細"]
            items:
              - ["内容量", "200g × 3種（計600g）"]
              - ["産地", "エチオピア・コロンビア・ブラジル"]
              - ["焙煎度", "浅煎り〜中深煎り（種類により異なる）"]
              - ["賞味期限", "製造日より180日"]
              - ["保存方法", "直射日光・高温多湿を避け、常温保存"]

      - type: cta
        h_mm: 12
        text: "カートに追加する　→"

  # ================================================================
  # No.3 ショッピングカート
  # ================================================================
  - title: "ショッピングカート"
    name: "cart"
    blocks:
      - type: col
        cols: 12
        h_mm: 55
        cells:
          - kind: table
            span: 12
            headers: ["商品名", "単価", "数量", "小計"]
            items:
              - ["プレミアムコーヒーセット", "¥3,980", "1", "¥3,980"]
              - ["オーガニック緑茶 詰め合わせ", "¥2,480", "2", "¥4,960"]
              - ["ハーブティーバラエティ", "¥1,980", "1", "¥1,980"]

      - type: col
        cols: 12
        h_mm: 30
        cells:
          - kind: text
            span: 8
            title: "小計"
            text: "¥10,920（税込）\n送料：無料（5,000円以上）\n合計：¥10,920"
          - kind: list
            span: 4
            list_type: ul
            items:
              - "クレジットカード"
              - "Amazon Pay"
              - "コンビニ払い"
              - "銀行振込"

      - type: cta
        h_mm: 12
        text: "レジに進む　→"

  # ================================================================
  # No.4 注文フォーム
  # ================================================================
  - title: "お届け先・お支払い"
    name: "checkout"
    blocks:
      - type: col
        cols: 12
        h_mm: 110
        cells:
          - kind: form
            span: 8
            items:
              - label: "お名前"
                type: text
                placeholder: "山田 太郎"
              - label: "郵便番号"
                type: text
                placeholder: "000-0000"
              - label: "都道府県"
                type: select
                options:
                  - "東京都"
                  - "大阪府"
                  - "神奈川県"
                  - "その他"
              - label: "住所"
                type: text
                placeholder: "〇〇市〇〇町1-2-3"
              - label: "電話番号"
                type: tel
                placeholder: "090-0000-0000"
              - label: "メールアドレス"
                type: email
                placeholder: "info@example.com"
              - label: "お支払い方法"
                type: radio
                options:
                  - "クレジットカード"
                  - "Amazon Pay"
                  - "コンビニ払い"
              - label: "注文を確定する"
                type: submit
