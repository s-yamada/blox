# corporate.yaml - BtoB企業サイト サンプル
# 実績・サービス紹介・採用・お問い合わせを想定

title: "株式会社サンプル"
author: "サンプル作成者"
theme: navy

pages:

  # ================================================================
  # No.1 トップページ
  # ================================================================
  - title: "トップページ"
    name: "top"
    nav: true
    nav_label: "トップ"
    blocks:
      - type: hero
        h_mm: 55
        image_label: "メインビジュアル"
        caption: "技術で、未来を切り拓く。"

      - type: stats
        h_mm: 22
        items:
          - num: "1984年"
            label: "設立"
          - num: "320名"
            label: "従業員数"
          - num: "850社"
            label: "取引実績"
          - num: "15拠点"
            label: "国内ネットワーク"

      - type: grid
        kind: card
        cols: 3
        item_h_mm: 58
        items:
          - image_label: "サービスイメージA"
            title: "システム開発"
            text: "要件定義から保守運用まで、ワンストップで対応します。"
          - image_label: "サービスイメージB"
            title: "クラウド移行支援"
            text: "オンプレ環境からAWS・Azure への安全な移行を支援します。"
          - image_label: "サービスイメージC"
            title: "セキュリティ対策"
            text: "脆弱性診断からインシデント対応まで、総合的にサポートします。"

      - type: cta
        h_mm: 14
        text: "まずはお気軽にご相談ください"

  # ================================================================
  # No.2 会社概要
  # ================================================================
  - title: "会社概要"
    name: "about"
    nav: true
    nav_label: "会社概要"
    blocks:
      - type: col
        cols: 12
        h_mm: 55
        cells:
          - kind: img
            span: 5
            image_label: "本社外観"
          - kind: text
            span: 7
            title: "私たちについて"
            text: "1984年の創業以来、ITソリューションを通じて企業の課題解決に取り組んでいます。\n「技術で、未来を切り拓く」を企業理念に、常に最先端の技術を追求し続けています。"

      - type: col
        cols: 12
        h_mm: 55
        cells:
          - kind: text
            span: 7
            title: "会社情報"
          - kind: table
            span: 5
            headers: ["項目", "内容"]
            items:
              - ["会社名", "株式会社サンプル"]
              - ["設立", "1984年4月1日"]
              - ["資本金", "5,000万円"]
              - ["代表取締役", "山田 太郎"]
              - ["従業員数", "320名（2024年4月現在）"]
              - ["本社所在地", "東京都千代田区〇〇1-2-3"]

      - type: steps
        h_mm: 38
        items:
          - num: "1984"
            title: "創業"
            text: "東京都にてシステム開発会社として設立"
          - num: "1995"
            title: "上場"
            text: "東証スタンダード市場へ上場"
          - num: "2005"
            title: "海外展開"
            text: "シンガポール・ベトナムに拠点開設"
          - num: "2015"
            title: "DX事業開始"
            text: "デジタルトランスフォーメーション支援部門を設立"
          - num: "2024"
            title: "現在"
            text: "850社超の取引先とともに成長を続ける"

  # ================================================================
  # No.3 採用情報
  # ================================================================
  - title: "採用情報"
    name: "recruit"
    nav: true
    nav_label: "採用"
    blocks:
      - type: hero
        h_mm: 40
        image_label: "オフィス・チーム写真"
        caption: "あなたの力で、社会を動かす仕事をしませんか。"

      - type: grid
        kind: text
        cols: 2
        item_h_mm: 38
        items:
          - title: "エンジニア職"
            text: "Webシステム・組み込み・インフラなど幅広いフィールドで活躍できます。リモートワーク制度あり。"
          - title: "営業・コンサルタント職"
            text: "お客様の課題をITで解決する提案営業です。技術知識がなくても入社後に習得できます。"
          - title: "プロジェクトマネージャー"
            text: "複数案件のマネジメントを担当。PMP・情報処理資格保有者優遇。"
          - title: "バックオフィス職"
            text: "経理・人事・総務など、会社を支える縁の下の力持ちを募集しています。"

      - type: col
        cols: 12
        h_mm: 50
        cells:
          - kind: table
            span: 12
            headers: ["職種", "雇用形態", "勤務地", "給与"]
            items:
              - ["エンジニア（Web）", "正社員", "東京・リモート可", "月給28万円〜"]
              - ["エンジニア（インフラ）", "正社員", "東京・大阪", "月給26万円〜"]
              - ["プロジェクトマネージャー", "正社員", "東京", "月給35万円〜"]
              - ["営業・コンサルタント", "正社員", "東京・名古屋・大阪", "月給25万円〜"]

  # ================================================================
  # No.4 お問い合わせ
  # ================================================================
  - title: "お問い合わせ"
    name: "contact"
    nav: true
    nav_label: "お問い合わせ"
    blocks:
      - type: col
        cols: 12
        h_mm: 120
        cells:
          - kind: form
            span: 8
            items:
              - label: "会社名"
                type: text
                placeholder: "株式会社〇〇"
              - label: "お名前"
                type: text
                placeholder: "山田 太郎"
              - label: "部署・役職"
                type: text
                placeholder: "情報システム部 部長"
              - label: "メールアドレス"
                type: email
                placeholder: "info@example.com"
              - label: "電話番号"
                type: tel
                placeholder: "03-0000-0000"
              - label: "お問い合わせ種別"
                type: select
                options:
                  - "サービスについて"
                  - "採用について"
                  - "資料請求"
                  - "その他"
              - label: "お問い合わせ内容"
                type: textarea
              - label: "個人情報の取り扱いに同意する"
                type: checkbox
                text: "プライバシーポリシーに同意します"
              - label: "送信する"
                type: submit
